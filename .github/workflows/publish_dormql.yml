name: Release package:dormql

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  runs-on: ubuntu-latest
  environment: pub.dev
  steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
    - name: clean directory
      run: |
        rm -rf packages
        rm -rf docs
        mv example/db_postgres_dorm_example/* example/
        rm -rf example/db_postgres_dorm_example

    - run: dart pub get
    - run: dart pub publish --dry-run
    - run: dart pub publish -f
