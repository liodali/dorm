name: Release package dormql_analyzer_plugin

on:
  push:
    tags:
      - "dormql_analyzer_plugin-v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  id-token: write # This is required for requesting the JWT, for authentication using OIDC
  contents: read # This is required for actions/checkout

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
      - name: clean directories
        run: |
          rm -rf docs
          mv example/db_postgres_dorm_example/* example/
          rm -rf example/db_postgres_dorm_example

      - name: publish
        run: |
          cd packages/dormql_analyzer_plugin
          dart pub get
          dart format .
          dart pub publish --dry-run
          dart pub publish -f
